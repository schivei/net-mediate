name: CI/CD Pipeline

on:
  push:
    # 'main' is intentionally excluded here: CI on main is triggered by the
    # 'workflow_run' event below so it always runs AFTER version-bump has
    # committed the new versions.props, ensuring builds use the correct version.
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # calculate version, build/test all projects, and run SonarCloud analysis; on main branch also run benchmarks and post results to PR comment
  # <VersionYear>$([System.DateTime]::UtcNow.Year)</VersionYear>
  # <VersionMajor>$([System.DateTime]::UtcNow.Month)</VersionMajor>
  # <VersionMinor>$([System.DateTime]::UtcNow.Day)</VersionMinor>
  # <VersionPatch>$([System.DateTime]::UtcNow.Subtract($([System.DateTime]::UtcNow.Date)).TotalMinutes.ToString("F0"))</VersionPatch>
  # <Stable>$(VersionYear).$(VersionMajor).$(VersionMinor)</Stable>
  # <Version>$(Stable).$(VersionPatch)$(Suffix)</Version>
  # the Version must be propagated to all projects for the source-generation integration tests to work, so we run the version-bump workflow on every PR and main commit, but only publish packages from main commits (the version-bump workflow creates a separate commit with the new version after the PR is merged, so the merge commit itself is not published and does not trigger a release)

  version-calculation:
    name: Version Calculation
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.create-variable.outputs.version }}

    steps:
    - name: Create Variable
      id: create-variable
      shell: pwsh
      run: |
        $year=[System.DateTime]::UtcNow.Year
        $month=[System.DateTime]::UtcNow.Month
        $day=[System.DateTime]::UtcNow.Day
        $patch=[System.DateTime]::UtcNow.Subtract([System.DateTime]::UtcNow.Date).TotalMinutes.ToString("F0")
        $env:VERSION="$year.$month.$day.$patch"
        echo "version=$env:VERSION" >> $GITHUB_ENV
        echo "version=$env:VERSION" >> $GITHUB_OUTPUT
        echo "::set-output name=version::$env:VERSION"

  site-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build website
        run: npm run build

  build-and-test:
    needs: [version-calculation]
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      VERSION: ${{ needs.version-calculation.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        # When triggered by workflow_run (after version-bump), explicitly checkout
        # refs/heads/main so we get the bumped versions.props, not the stale merge commit.
        ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || '' }}
        
    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: '10.x'
        
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './website/package-lock.json'

    - name: Install SonarScanner for .NET
      if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 11.2.1 || \
          dotnet tool update --global dotnet-sonarscanner --version 11.2.1
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Begin Sonar analysis
      if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      env:
        SONAR_PROJECT_KEY: schivei_net-mediate
        SONAR_ORGANIZATION: schivei
        SONAR_HOST_URL: https://sonarcloud.io
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BRANCH: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        SONAR_ARGS=(
          "/k:${SONAR_PROJECT_KEY}"
          "/o:${SONAR_ORGANIZATION}"
          "/d:sonar.host.url=${SONAR_HOST_URL}"
          "/d:sonar.token=${SONAR_TOKEN}"
          "/d:sonar.cs.cobertura.reportsPaths=coverage/**/coverage.cobertura.xml"
          "/d:sonar.coverage.exclusions=.github/**,src/NetMediate.Core/**,src/NetMediate.Diagnostics/**,src/NetMediate.SourceGeneration/**,src/NetMediate.Moq/**,src/NetMediate.Quartz/**"
          "/d:sonar.issue.ignore.multicriteria=e1"
          "/d:sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S107"
          "/d:sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs"
          "/d:sonar.exclusions=**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
          "/d:sonar.cpd.exclusions=.github/**,tests/**,**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
          "/d:sonar.test.exclusions=**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
        )

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          SONAR_ARGS+=(
            "/d:sonar.pullrequest.key=${PR_NUMBER}"
            "/d:sonar.pullrequest.branch=${PR_BRANCH}"
            "/d:sonar.pullrequest.base=${PR_BASE}"
          )
        else
          SONAR_ARGS+=("/d:sonar.branch.name=${REF_NAME}")
        fi

        dotnet-sonarscanner begin "${SONAR_ARGS[@]}"
        
    - name: Cache NuGet packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Update props
      run: |
        sed -i "s|<PackageReference Include=\"NetMediate\" Version=\"[^\"]*\" />|<PackageReference Include=\"NetMediate\" Version=\"${VERSION}\" />|g" src/NetMediate.SourceGeneration/buildTransitive/NetMediate.SourceGeneration.props

    - name: Pre-pack NetMediate packages for package-metadata and source-generation tests
      run: |
        dotnet restore src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj
        dotnet pack    src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --configuration Release --no-restore /p:Version=${VERSION}
        dotnet restore src/NetMediate/NetMediate.csproj
        dotnet pack    src/NetMediate/NetMediate.csproj --configuration Release --no-restore /p:Version=${VERSION}
      # Package metadata tests and source-generation package-reference tests read the
      # nupkg directly from src/**/bin/Release/, so the packages must exist before test.

    - name: Restore dependencies
      run: dotnet restore net-mediate.slnx

    - name: Build NetMediate
      run: dotnet build src/NetMediate/NetMediate.csproj --configuration Release --no-restore /p:Version=${VERSION}

    - name: Build NetMediate.Core
      run: dotnet build src/NetMediate.Core/NetMediate.Core.csproj --configuration Release --no-restore /p:Version=${VERSION}

    - name: Build NetMediate.Diagnostics
      run: dotnet build src/NetMediate.Diagnostics/NetMediate.Diagnostics.csproj --configuration Release /p:Version=${VERSION}

    - name: Build NetMediate.Moq
      run: dotnet build src/NetMediate.Moq/NetMediate.Moq.csproj --configuration Release /p:Version=${VERSION}

    - name: Build NetMediate.Resilience
      run: dotnet build src/NetMediate.Resilience/NetMediate.Resilience.csproj --configuration Release /p:Version=${VERSION}
      
    - name: Build NetMediate.SourceGeneration
      run: dotnet build src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --configuration Release /p:Version=${VERSION}
      
    - name: Build NetMediate.Quartz
      run: dotnet build src/NetMediate.Quartz/NetMediate.Quartz.csproj --configuration Release /p:Version=${VERSION}
      
    - name: Test
      run: dotnet test tests/NetMediate.Tests/NetMediate.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage  /p:Version=${VERSION}

    - name: Test Resilience
      run: dotnet test tests/NetMediate.Resilience.Tests/NetMediate.Resilience.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage  /p:Version=${VERSION}

    - name: Test Diagnostics
      run: dotnet test tests/NetMediate.Diagnostics.Tests/NetMediate.Diagnostics.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage  /p:Version=${VERSION}

    - name: Test SourceGeneration (package-reference integration)
      run: dotnet test tests/NetMediate.SourceGeneration.Tests/NetMediate.SourceGeneration.Tests.csproj --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage  /p:Version=${VERSION}

    - name: Enforce 100% line coverage for source packages
      run: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET, os, sys

        xml_files = [
            os.path.join(r, f)
            for r, _, files in os.walk('./coverage')
            for f in files if f == 'coverage.cobertura.xml'
        ]
        if not xml_files:
            print("No coverage.cobertura.xml found.", file=sys.stderr)
            sys.exit(1)

        # Packages excluded from Sonar coverage tracking (align with sonar.coverage.exclusions).
        # These are excluded here too so the gate stays consistent with what Sonar reports.
        EXCLUDED_PREFIXES = (
            'NetMediate.Core/',
            'NetMediate.Diagnostics/',
            'NetMediate.SourceGeneration/',
            # Integration adapters without dedicated test projects — excluded from
            # both Sonar coverage and this gate; they are tested via their consumers.
            'NetMediate.Moq/',
            'NetMediate.Quartz/',
        )

        # Merge all reports: for each (filename, lineNumber) take the max hits
        # across all test-project Cobertura files so lines covered by any test
        # project count as covered.
        merged: dict = {}  # (filename, lineNumber) -> max hits

        for xml_file in xml_files:
            root = ET.parse(xml_file).getroot()
            for cls in root.findall('.//class'):
                filename = cls.get('filename', '')
                norm = filename.replace('\\', '/')
                # Skip generated / obj files
                if '/obj/' in norm:
                    continue
                # Only include NetMediate source packages
                if not (norm.startswith('NetMediate/') or norm.startswith('NetMediate.')):
                    continue
                # Skip packages that Sonar excludes from coverage tracking
                if norm.startswith(EXCLUDED_PREFIXES):
                    continue
                for line in cls.findall('./lines/line'):
                    hits = int(line.get('hits', 0) or 0)
                    lnum = int(line.get('number', 0) or 0)
                    key = (filename, lnum)
                    merged[key] = max(merged.get(key, 0), hits)

        total   = len(merged)
        covered = sum(1 for hits in merged.values() if hits > 0)

        if total == 0:
            print("❌ No trackable source lines found in coverage reports. Verify coverage collection is enabled.", file=sys.stderr)
            sys.exit(1)

        uncovered_by_file: dict = {}
        for (filename, lnum), hits in merged.items():
            if hits == 0:
                uncovered_by_file.setdefault(filename, []).append(lnum)

        if not uncovered_by_file:
            pct = 100.0 * covered / total
            print(f"✅ Source package line coverage: {pct:.1f}% ({covered}/{total} lines) — gate passed.")
            sys.exit(0)

        pct = 100.0 * covered / total
        print(f"❌ Source package line coverage: {pct:.1f}% — 100% required.", file=sys.stderr)
        for f, lines in sorted(uncovered_by_file.items()):
            print(f"  {f}: uncovered lines {sorted(lines)}", file=sys.stderr)
        sys.exit(1)
        PYEOF

    - name: End Sonar analysis
      if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      run: |
        dotnet-sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"
      
    - name: Run Benchmarks (PR only)
      if: github.event_name == 'pull_request'
      env:
        BRANCH: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        COMMIT_SHA: ${{ github.sha }}
        BENCH_REPORT: ${{ runner.temp }}/bench-report.md
        BENCH_BASE_REPORT: ${{ runner.temp }}/bench-base-report.md
        BENCH_BASE: ${{ runner.temp }}/benchmarks-base.md
      run: |
        # ── 1. Run base-branch benchmark on the same machine (isolate execution) ──────
        # Using git worktree ensures the base branch is measured on identical hardware
        # in the same CI job, making the timing comparison directly meaningful.
        if ! git fetch origin "$BASE_REF" 2>/dev/null; then
          echo "::warning::Could not fetch $BASE_REF — base-branch benchmark will be skipped; timing comparison will use the stored baseline instead."
        fi
        BASE_WORKTREE=$(mktemp -d)
        if git worktree add "$BASE_WORKTREE" "origin/$BASE_REF" 2>/dev/null; then
          (
            cd "$BASE_WORKTREE"
            dotnet restore tests/NetMediate.Benchmarks/NetMediate.Benchmarks.csproj \
              -q --nologo 2>/dev/null || true
            dotnet build tests/NetMediate.Benchmarks/NetMediate.Benchmarks.csproj \
              --configuration Release --no-restore -q --nologo 2>/dev/null || true
            cd tests/NetMediate.Benchmarks
            dotnet run --no-build --configuration Release -- \
              --job Short --exporters GitHub --filter '*' 2>/dev/null || true
            BASE_RPT=$(find BenchmarkDotNet.Artifacts -name '*-report-github.md' \
              2>/dev/null | head -1)
            [ -n "$BASE_RPT" ] && cp "$BASE_RPT" "$BENCH_BASE_REPORT" || true
          ) 2>/dev/null || true
          git worktree remove "$BASE_WORKTREE" --force 2>/dev/null || true
        fi

        # ── 2. Run current-branch benchmark ─────────────────────────────────────────
        cd tests/NetMediate.Benchmarks
        dotnet run --configuration Release -- --job Short --exporters GitHub --filter '*' \
          2>&1 | tee "$RUNNER_TEMP/bench-console.txt" || true
        REPORT=$(find BenchmarkDotNet.Artifacts -name '*-report-github.md' 2>/dev/null | head -1)
        if [ -n "$REPORT" ]; then
          cp "$REPORT" "$BENCH_REPORT"
          cd ../..
          # Fetch base branch BENCHMARKS.md as fallback baseline (used when no live base run)
          git show "origin/$BASE_REF:docs/BENCHMARKS.md" > "$BENCH_BASE" 2>/dev/null \
            || echo '<!-- netmediate-bench-baseline: {} -->' > "$BENCH_BASE"
          python3 .github/scripts/update_benchmarks.py
        fi

    - name: Commit benchmark results
      if: github.event_name == 'pull_request'
      uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
      with:
        add: 'docs/BENCHMARKS.md website/docs/performance/benchmarks.md'
        message: 'chore: update BENCHMARKS.md from CI benchmark run [skip ci]'
        default_author: github_actions
        push: 'origin HEAD:refs/heads/${{ github.head_ref }}'
        
    - name: Post coverage summary to PR
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET, os, subprocess, sys, json

        MARKER = "<!-- netmediate-coverage-report -->"

        xml_files = [
            os.path.join(r, f)
            for r, _, files in os.walk('./coverage')
            for f in files if f == 'coverage.cobertura.xml'
        ]
        if not xml_files:
            print("No coverage.cobertura.xml found, skipping PR comment.")
            sys.exit(0)

        # Keep the PR summary aligned with the source-package coverage gate and Sonar scope.
        EXCLUDED_PREFIXES = (
            'NetMediate.Core/',
            'NetMediate.Diagnostics/',
            'NetMediate.SourceGeneration/',
            'NetMediate.Moq/',
            'NetMediate.Quartz/',
        )

        # Merge coverage by source line across all reports so shared source files
        # from multiple test projects are not double-counted.
        merged_lines = {}

        for xml_file in xml_files:
            root = ET.parse(xml_file).getroot()
            for cls in root.findall('.//class'):
                filename = cls.get('filename')
                if not filename:
                    continue

                norm = filename.replace('\\', '/')
                if '/obj/' in norm:
                    continue
                if not (norm.startswith('NetMediate/') or norm.startswith('NetMediate.')):
                    continue
                if norm.startswith(EXCLUDED_PREFIXES):
                    continue

                for line in cls.findall('./lines/line'):
                    line_number = int(line.get('number', 0) or 0)
                    hits = int(line.get('hits', 0) or 0)
                    line_key = (filename, line_number)
                    merged_lines[line_key] = max(merged_lines.get(line_key, 0), hits)

        total_valid = len(merged_lines)
        total_covered = sum(1 for hits in merged_lines.values() if hits > 0)

        if total_valid == 0:
            print("No trackable source-package lines found, skipping PR comment.")
            sys.exit(0)

        line_rate   = (total_covered / total_valid   * 100) if total_valid   > 0 else 0.0

        emoji = '✅' if line_rate >= 80 else '⚠️' if line_rate >= 60 else '❌'
        sha   = os.environ['COMMIT_SHA'][:7]

        comment = (
            f"{MARKER}\n\n"
            f"## {emoji} Source Package Coverage Report — `{sha}`\n\n"
            f"| Metric | Coverage |\n"
            f"|--------|----------|\n"
            f"| **Lines** | {line_rate:.1f}% ({total_covered}/{total_valid} lines) |\n"
            f"<sub>Scope matches the source-package coverage gate and Sonar exclusions.</sub>\n\n"
            f"<sub>Generated by CI from `dotnet test --collect:\"XPlat Code Coverage\"`</sub>"
        )

        pr   = os.environ['PR_NUMBER']
        repo = os.environ['REPO']

        # Find an existing coverage comment by the bot with our marker and update it;
        # fall back to creating a new comment if none exists.
        list_result = subprocess.run(
            ['gh', 'api', f'repos/{repo}/issues/{pr}/comments',
             '--jq', f'[.[] | select(.body | startswith("{MARKER}")) | .id][0]'],
            capture_output=True, text=True
        )
        comment_id = list_result.stdout.strip()

        if comment_id and comment_id != 'null' and comment_id != '':
            subprocess.run(
                ['gh', 'api', f'repos/{repo}/issues/comments/{comment_id}',
                 '-X', 'PATCH', '-f', f'body={comment}'],
                check=True
            )
            print(f"Updated existing coverage comment {comment_id}.")
        else:
            subprocess.run(
                ['gh', 'pr', 'comment', pr, '--repo', repo, '--body', comment],
                check=True
            )
            print("Created new coverage comment.")
        PYEOF

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [version-calculation, build-and-test]
    if: >-
      ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version-calculation.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        fetch-depth: 0
        
    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: '10.x'
        
    - name: Update props
      run: |
        sed -i "s|<PackageReference Include=\"NetMediate\" Version=\"[^\"]*\" />|<PackageReference Include=\"NetMediate\" Version=\"${VERSION}\" />|g" src/NetMediate.SourceGeneration/buildTransitive/NetMediate.SourceGeneration.props

    - name: Restore dependencies
      run: dotnet restore net-mediate.slnx
      
    - name: Build Release (all projects/targets)
      run: dotnet build net-mediate.slnx --configuration Release /p:Version=${VERSION}

    - name: Pack NetMediate package
      run: dotnet pack src/NetMediate/NetMediate.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Core package
      run: dotnet pack src/NetMediate.Core/NetMediate.Core.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Diagnostics package
      run: dotnet pack src/NetMediate.Diagnostics/NetMediate.Diagnostics.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Moq package
      run: dotnet pack src/NetMediate.Moq/NetMediate.Moq.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Resilience package
      run: dotnet pack src/NetMediate.Resilience/NetMediate.Resilience.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.SourceGeneration package
      run: dotnet pack src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --configuration Release --output ./packages /p:Version=${VERSION}
      
    - name: Pack NetMediate.Quartz package
      run: dotnet pack src/NetMediate.Quartz/NetMediate.Quartz.csproj --configuration Release --output ./packages /p:Version=${VERSION}
      
    - name: Upload package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    # Publish to NuGet only on main; tag pushes attach packages to the GitHub
    # Release (created by the release job) but do not push to NuGet.
    if: github.ref == 'refs/heads/main'
    # Declaring a GitHub Environment makes this job appear in the Deployments section
    # and allows protection rules (required reviewers, wait timers, etc.) to be
    # configured on the "nuget" environment in repository Settings → Environments.
    environment: nuget
    permissions:
      contents: read
      packages: write

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: ./packages

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
      with:
        dotnet-version: '10.x'

    - name: Publish to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to GitHub Packages
      continue-on-error: true
      run: dotnet nuget push ./packages/*.nupkg --api-key $GITHUB_TOKEN --source https://nuget.pkg.github.com/schivei/index.json --skip-duplicate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-calculation, package, publish]
    # Run when the package job succeeded AND either:
    #   • publish succeeded (main branch — both NuGet push and GitHub Release)
    #   • publish was skipped (tag push — create GitHub Release without a NuGet push)
    if: >-
      needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: ./packages

    - name: Determine tag name
      id: tag
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          echo "tag_name=v${{ needs.version-calculation.outputs.version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        target_commitish: ${{ github.sha }}
        files: ./packages/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.tag_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
