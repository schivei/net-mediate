name: Version Bump on PR Merge

# Triggered when a PR is closed (merged) into main.
# Analyzes the size of the change and bumps major or minor accordingly.
on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  bump-version:
    name: Analyze Impact and Bump Version
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Checkout main
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.x'

    - name: Analyze PR impact
      id: impact
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        # Use merge_commit_sha — this commit already exists on main after the merge
        # and is guaranteed to be reachable from the full-depth checkout above.
        HEAD_SHA="${{ github.event.pull_request.merge_commit_sha }}"
        # Explicitly fetch both SHAs in case history depth or fork state means
        # they are not yet in the local object store. Errors here are expected
        # when a SHA is already present; the cat-file check below is authoritative.
        git fetch origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || \
           ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
          echo "::warning::One or both SHAs not reachable -- fetching all refs."
          git fetch --all
        fi
        BUMP_TYPE=$(python .github/scripts/analyze_version_impact.py "$BASE_SHA" "$HEAD_SHA")
        echo "bump_type=${BUMP_TYPE}" >> "$GITHUB_OUTPUT"
        echo "Determined bump type: ${BUMP_TYPE}"

    - name: Bump version
      id: bump
      run: python .github/scripts/bump_version.py --type ${{ steps.impact.outputs.bump_type }}

    - name: Commit and push bumped version
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add versions.props
        git diff --cached --quiet && echo "No changes to commit." && exit 0
        BUMP_TYPE="${{ steps.impact.outputs.bump_type }}"
        VERSION=$(python -c "
        import xml.etree.ElementTree as ET
        r = ET.parse('versions.props').getroot()
        p = r.find('PropertyGroup')
        y = p.findtext('VersionYear','0')
        maj = p.findtext('VersionMajor','0')
        min_ = p.findtext('VersionMinor','0')
        pat = p.findtext('VersionPatch','0')
        print(f'{y}.{maj}.{min_}.{pat}')
        ")
        git commit -m "chore: bump ${BUMP_TYPE} version to ${VERSION} [skip ci]"
        git push origin HEAD:refs/heads/main
