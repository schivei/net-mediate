name: Version Bump on PR Merge

# Triggered when a PR is closed (merged) into main.
# Analyzes the size of the change and bumps major or minor accordingly.
on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  bump-version:
    name: Analyze Impact and Bump Version
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: read

    steps:
    - name: Checkout main
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: main
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: '3.x'

    - name: Analyze PR impact
      id: impact
      run: |
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        # Use merge_commit_sha — this commit already exists on main after the merge
        # and is guaranteed to be reachable from the full-depth checkout above.
        HEAD_SHA="${{ github.event.pull_request.merge_commit_sha }}"
        # Explicitly fetch both SHAs in case history depth or fork state means
        # they are not yet in the local object store. Errors here are expected
        # when a SHA is already present; the cat-file check below is authoritative.
        git fetch origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true
        if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null || \
           ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
          echo "::warning::One or both SHAs not reachable -- fetching all refs."
          git fetch --all
        fi
        BUMP_TYPE=$(python .github/scripts/analyze_version_impact.py "$BASE_SHA" "$HEAD_SHA")
        echo "bump_type=${BUMP_TYPE}" >> "$GITHUB_OUTPUT"
        echo "Determined bump type: ${BUMP_TYPE}"

    - name: Bump version
      id: bump
      run: python .github/scripts/bump_version.py --type ${{ steps.impact.outputs.bump_type }}

    - name: Commit and push version bump
      uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
      with:
        add: 'versions.props'
        message: 'chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]'
        default_author: github_actions
        push: 'origin HEAD:refs/heads/main'
