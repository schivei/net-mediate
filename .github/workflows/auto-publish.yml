name: Scheduled Auto-Publish

# Runs on the second Thursday of each month at 00:00 UTC.
# Days 8-14 always contain the second occurrence of any weekday.
on:
  schedule:
    - cron: '0 0 8-14 * 4'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual trigger'

permissions:
  contents: read
  issues: write
  packages: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  auto-publish:
    name: Auto-Publish (Second Thursday)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Needs contents: write to push the version-bump commit back to main.
    permissions:
      contents: write
      issues: write
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: '10.x'

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.x'

    - name: Cache NuGet packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore net-mediate.slnx -p:Configuration=Release

    - name: Check for outdated dependency versions
      id: check_deps
      run: |
        # We use wildcard versions (e.g. "10.*") so git-diffing .csproj files
        # will never show a version change. Instead, ask NuGet whether any
        # currently-resolved package has a newer version that satisfies our
        # constraints — that means a new transitive dependency was published.
        OUTDATED_JSON=$(dotnet list net-mediate.slnx package --outdated --format json 2>&1)
        DOTNET_EXIT=$?
        if [ "$DOTNET_EXIT" -ne 0 ]; then
          echo "::warning::dotnet list package --outdated failed (exit ${DOTNET_EXIT}): ${OUTDATED_JSON}"
          OUTDATED_JSON='{"projects":[]}'
        fi
        OUTDATED_COUNT=$(echo "$OUTDATED_JSON" | python3 -c "
        import json, sys
        try:
            data = json.load(sys.stdin)
            count = sum(
                len(fw.get('topLevelPackages', []))
                for proj in data.get('projects', [])
                for fw in proj.get('frameworks', [])
            )
            print(count)
        except Exception as e:
            # Parsing failed -- fail safe by publishing (assume something changed).
            print(f'::error::Failed to parse dotnet list package output: {e}', file=sys.stderr)
            print(1)
        ")
        if [ "${OUTDATED_COUNT:-0}" -gt 0 ]; then
          echo "Found ${OUTDATED_COUNT} outdated package(s) with new versions available -- publishing."
          echo "skip=false" >> "$GITHUB_OUTPUT"
        else
          echo "::notice::All packages are at their latest versions -- skipping publish."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Bump patch version (pre-publish)
      if: steps.check_deps.outputs.skip != 'true'
      id: bump
      run: python .github/scripts/bump_version.py --type patch

    - name: Commit bumped version
      if: steps.check_deps.outputs.skip != 'true'
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add versions.props
        git diff --cached --quiet && echo "No version changes to commit." && exit 0
        VERSION=$(python -c "
        import xml.etree.ElementTree as ET
        r = ET.parse('versions.props').getroot()
        p = r.find('PropertyGroup')
        y = p.findtext('VersionYear','0')
        maj = p.findtext('VersionMajor','0')
        min_ = p.findtext('VersionMinor','0')
        pat = p.findtext('VersionPatch','0')
        print(f'{y}.{maj}.{min_}.{pat}')
        ")
        git commit -m "chore: bump patch version to ${VERSION} [skip ci]"
        git push origin HEAD:refs/heads/main

    - name: Build all projects
      if: steps.check_deps.outputs.skip != 'true'
      run: dotnet build net-mediate.slnx --no-restore --configuration Release

    - name: Run tests
      if: steps.check_deps.outputs.skip != 'true'
      run: |
        dotnet test tests/NetMediate.Tests/NetMediate.Tests.csproj --configuration Release --verbosity normal

    - name: Pack all packages
      if: steps.check_deps.outputs.skip != 'true'
      run: |
        dotnet pack src/NetMediate/NetMediate.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.Core/NetMediate.Core.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.Diagnostics/NetMediate.Diagnostics.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.Moq/NetMediate.Moq.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.Resilience/NetMediate.Resilience.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.DataDog.OpenTelemetry/NetMediate.DataDog.OpenTelemetry.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.DataDog.Serilog/NetMediate.DataDog.Serilog.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.DataDog.ILogger/NetMediate.DataDog.ILogger.csproj --no-build --no-restore --configuration Release --output ./packages
        dotnet pack src/NetMediate.Quartz/NetMediate.Quartz.csproj --no-build --no-restore --configuration Release --output ./packages

    - name: Publish to NuGet
      if: steps.check_deps.outputs.skip != 'true'
      run: dotnet nuget push ./packages/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to GitHub Packages
      if: steps.check_deps.outputs.skip != 'true'
      continue-on-error: true
      run: dotnet nuget push ./packages/*.nupkg --api-key $GITHUB_TOKEN --source https://nuget.pkg.github.com/schivei/index.json --skip-duplicate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create failure issue
      if: failure()
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
      with:
        script: |
          const date = new Date().toISOString().slice(0, 10);
          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `[Auto-Publish] Scheduled publish failed on ${date}`,
            body: [
              '## Scheduled auto-publish failure',
              '',
              `The scheduled bi-monthly auto-publish workflow failed on **${date}**.`,
              '',
              `**Workflow run:** ${runUrl}`,
              '',
              '### What to check',
              '- Dependency version conflicts (wildcard `*` versions may have introduced a breaking change)',
              '- Test failures due to updated transitive dependencies',
              '- NuGet / GitHub Packages API key expiry',
              '',
              'Please investigate and resolve before the next scheduled run.',
            ].join('\n'),
            assignees: ['schivei'],
            labels: ['bug', 'auto-publish'],
          });
