name: CI/CD Pipeline

on:
  push:
    # 'main' is intentionally excluded here: CI on main is triggered by the
    # 'workflow_run' event below, so it always runs AFTER version-bump has
    # committed the new versions.props, ensuring builds use the correct version.
    branches: [ main ]
    tags: [ 'v*' ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  version-calculation:
    name: Version Calculation
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.create-variable.outputs.version }}

    steps:
    - name: Create Variable
      id: create-variable
      shell: pwsh
      run: |
        $year=[System.DateTime]::UtcNow.Year
        $month=[System.DateTime]::UtcNow.Month
        $day=[System.DateTime]::UtcNow.Day
        $patch=[System.DateTime]::UtcNow.Subtract([System.DateTime]::UtcNow.Date).TotalMinutes.ToString("F0")
        $env:VERSION="$year.$month.$day.$patch"
        echo "version=$env:VERSION" >> $GITHUB_ENV
        echo "version=$env:VERSION" >> $GITHUB_OUTPUT
        echo "::set-output name=version::$env:VERSION"

  site-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./website

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './website/package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit

      - name: Build website
        run: npm run build

  build-and-test:
    needs: [version-calculation]
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      VERSION: ${{ needs.version-calculation.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        # When triggered by workflow_run (after version-bump), explicitly checkout
        # refs/heads/main so we get the bumped versions.props, not the stale merge commit.
        ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || '' }}
        
    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'
        
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: './website/package-lock.json'

    - name: Install SonarScanner for .NET
      if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      run: |
        dotnet tool install --global dotnet-sonarscanner --version 11.2.1 || \
          dotnet tool update --global dotnet-sonarscanner --version 11.2.1
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

    - name: Begin Sonar analysis
      if: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      env:
        SONAR_PROJECT_KEY: schivei_net-mediate
        SONAR_ORGANIZATION: schivei
        SONAR_HOST_URL: https://sonarcloud.io
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_BRANCH: ${{ github.head_ref }}
        PR_BASE: ${{ github.base_ref }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        SONAR_ARGS=(
          "/k:${SONAR_PROJECT_KEY}"
          "/o:${SONAR_ORGANIZATION}"
          "/d:sonar.host.url=${SONAR_HOST_URL}"
          "/d:sonar.token=${SONAR_TOKEN}"
          "/d:sonar.cs.cobertura.reportsPaths=coverage/**/coverage.cobertura.xml"
          "/d:sonar.coverage.exclusions=.github/**"
          "/d:sonar.issue.ignore.multicriteria=e1"
          "/d:sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S107"
          "/d:sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs"
          "/d:sonar.exclusions=**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
          "/d:sonar.cpd.exclusions=.github/**,tests/**,**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
          "/d:sonar.test.exclusions=**/website/**,website/**,**/.github/scripts/**,.github/scripts/**"
        )

        if [ "${{ github.event_name }}" = "pull_request" ]; then
          SONAR_ARGS+=(
            "/d:sonar.pullrequest.key=${PR_NUMBER}"
            "/d:sonar.pullrequest.branch=${PR_BRANCH}"
            "/d:sonar.pullrequest.base=${PR_BASE}"
          )
        else
          SONAR_ARGS+=("/d:sonar.branch.name=${REF_NAME}")
        fi

        dotnet-sonarscanner begin "${SONAR_ARGS[@]}"
        
    - name: Cache NuGet packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
          
    - name: Update props
      run: |
        sed -i "s|<PackageReference Include=\"NetMediate\" Version=\"[^\"]*\" />|<PackageReference Include=\"NetMediate\" Version=\"${VERSION}\" />|g" src/NetMediate.SourceGeneration/buildTransitive/NetMediate.SourceGeneration.props

    - name: Pre-pack NetMediate packages for package-metadata and source-generation tests
      run: |
        dotnet restore src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj
        dotnet pack    src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --configuration Release --no-restore /p:Version=${VERSION}
        dotnet restore src/NetMediate/NetMediate.csproj
        dotnet pack    src/NetMediate/NetMediate.csproj --configuration Release --no-restore /p:Version=${VERSION}
      # Package metadata tests and source-generation package-reference tests read the
      # nupkg directly from src/**/bin/Release/, so the packages must exist before test.

    - name: Restore dependencies
      run: dotnet restore net-mediate.slnx

    - name: Build projects (per-project)
      run: |
        set -euo pipefail
        echo "Building projects individually to shorten CI logs"
        # Build all source and test projects individually so logs are scoped per project
        for proj in $(find src tests -name '*.csproj' -print); do
          echo "---- Building: $proj"
          dotnet build "$proj" --configuration Release /p:Version=${VERSION}
        done

    - name: Test projects (per-project)
      run: |
        set -euo pipefail
        echo "Running tests per project to keep output scoped"
        # Run tests per test project; use --no-build since projects were built above
        for testproj in $(find tests -type f -name '*Tests.csproj' -print); do
          echo "---- Testing: $testproj"
          dotnet test "$testproj" --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage /p:Version=${VERSION}
        done

    - name: Enforce 100% line and branch coverage for source packages
      run: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET, os, sys

        xml_files = [
            os.path.join(r, f)
            for r, _, files in os.walk('./coverage')
            for f in files if f == 'coverage.cobertura.xml'
        ]
        if not xml_files:
            print("No coverage.cobertura.xml found.", file=sys.stderr)
            sys.exit(1)

        # Packages excluded from Sonar coverage tracking (align with sonar.coverage.exclusions).
        # No source project package is excluded.
        EXCLUDED_PREFIXES = ()

        # Merge all reports: for each (filename, lineNumber) take the max hits
        # across all test-project Cobertura files so lines covered by any test
        # project count as covered.
        merged_lines: dict = {}     # (filename, lineNumber) -> max hits
        merged_branches: dict = {}  # (filename, lineNumber) -> (covered, valid)

        for xml_file in xml_files:
            root = ET.parse(xml_file).getroot()
            for cls in root.findall('.//class'):
                filename = cls.get('filename', '')
                norm = filename.replace('\\', '/')
                # Skip generated / obj files
                if '/obj/' in norm:
                    continue
                # Only include NetMediate source packages
                if not (norm.startswith('NetMediate/') or norm.startswith('NetMediate.')):
                    continue
                # Skip packages that Sonar excludes from coverage tracking
                if norm.startswith(EXCLUDED_PREFIXES):
                    continue
                for line in cls.findall('./lines/line'):
                    hits = int(line.get('hits', 0) or 0)
                    lnum = int(line.get('number', 0) or 0)
                    key = (filename, lnum)
                    merged_lines[key] = max(merged_lines.get(key, 0), hits)

                    if line.get('branch') == 'True':
                        coverage = line.get('condition-coverage', '')
                        if '(' in coverage and '/' in coverage:
                            fraction = coverage.split('(', 1)[1].split(')', 1)[0]
                            covered, valid = (int(part) for part in fraction.split('/', 1))
                        else:
                            covered = 1 if hits > 0 else 0
                            valid = 1

                        bkey = (filename, lnum)
                        prev_covered, prev_valid = merged_branches.get(bkey, (0, 0))
                        merged_branches[bkey] = (
                            max(prev_covered, covered),
                            max(prev_valid, valid),
                        )

        total_lines = len(merged_lines)
        covered_lines = sum(1 for hits in merged_lines.values() if hits > 0)
        total_branches = sum(valid for _, valid in merged_branches.values())
        covered_branches = sum(covered for covered, _ in merged_branches.values())

        if total_lines == 0:
            print("❌ No trackable source lines found in coverage reports. Verify coverage collection is enabled.", file=sys.stderr)
            sys.exit(1)

        uncovered_by_file: dict = {}
        for (filename, lnum), hits in merged_lines.items():
            if hits == 0:
                uncovered_by_file.setdefault(filename, []).append(lnum)

        line_pct = 100.0 * covered_lines / total_lines
        branch_pct = 100.0 * covered_branches / total_branches if total_branches > 0 else 100.0

        if not uncovered_by_file and covered_branches == total_branches:
            print(
                f"✅ Source package coverage: lines {line_pct:.1f}% ({covered_lines}/{total_lines}), "
                f"branches {branch_pct:.1f}% ({covered_branches}/{total_branches}) — gate passed."
            )
            sys.exit(0)

        print(
            f"❌ Source package coverage: lines {line_pct:.1f}% ({covered_lines}/{total_lines}), "
            f"branches {branch_pct:.1f}% ({covered_branches}/{total_branches}) — 100% required for both.",
            file=sys.stderr
        )

        if uncovered_by_file:
            for f, lines in sorted(uncovered_by_file.items()):
                print(f"  {f}: uncovered lines {sorted(lines)}", file=sys.stderr)

        uncovered_branches_by_file: dict = {}
        for (filename, lnum), (covered, valid) in merged_branches.items():
            if covered < valid:
                uncovered_branches_by_file.setdefault(filename, []).append((lnum, covered, valid))

        if uncovered_branches_by_file:
            for f, branches in sorted(uncovered_branches_by_file.items()):
                detail = ", ".join(f"{lnum}({covered}/{valid})" for lnum, covered, valid in sorted(branches))
                print(f"  {f}: uncovered branches [{detail}]", file=sys.stderr)

        sys.exit(1)
        PYEOF

    - name: End Sonar analysis
      if: ${{ always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && env.SONAR_TOKEN != '' }}
      run: |
        dotnet-sonarscanner end "/d:sonar.token=${SONAR_TOKEN}"
      
    - name: Run Benchmarks (PR only)
      if: github.event_name == 'pull_request'
      env:
        BRANCH: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        COMMIT_SHA: ${{ github.sha }}
        BENCH_REPORT: ${{ runner.temp }}/bench-report.md
        BENCH_BASE: ${{ runner.temp }}/benchmarks-base.md
      run: |
        # ── Run current-branch benchmark ─────────────────────────────────────────
        cd tests/NetMediate.Benchmarks
        # Ensure NuGet packages and project assets are restored on the runner
        dotnet restore --configfile ../../NuGet.Config || dotnet restore || true
        dotnet run --configuration Release -- --job Short --filter '*' \
          2>&1 | grep -v "Failed to set up high priority (Permission denied)" \
          | tee "$RUNNER_TEMP/bench-console.txt" || true
        REPORT=$(find BenchmarkDotNet.Artifacts -name '*-report-github.md' 2>/dev/null | head -1)
        if [ -n "$REPORT" ]; then
          cp "$REPORT" "$BENCH_REPORT"
          cd ../..
          # Fetch base branch BENCHMARKS.md as baseline
          git show "origin/$BASE_REF:docs/BENCHMARKS.md" > "$BENCH_BASE" 2>/dev/null \
            || echo '<!-- netmediate-bench-baseline: {} -->' > "$BENCH_BASE"
          python3 .github/scripts/update_benchmarks.py
        fi

    - name: Commit benchmark results
      if: github.event_name == 'pull_request'
      uses: EndBug/add-and-commit@290ea2c423ad77ca9c62ae0f5b224379612c0321 # v10.0.0
      with:
        add: 'docs/BENCHMARKS.md website/docs/performance/benchmarks.md'
        message: 'chore: update BENCHMARKS.md from CI benchmark run [skip ci]'
        default_author: github_actions
        push: 'origin HEAD:refs/heads/${{ github.head_ref }}'
        
    - name: Post coverage summary to PR
      if: github.event_name == 'pull_request'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        python3 << 'PYEOF'
        import xml.etree.ElementTree as ET, os, subprocess, sys, json

        MARKER = "<!-- netmediate-coverage-report -->"

        xml_files = [
            os.path.join(r, f)
            for r, _, files in os.walk('./coverage')
            for f in files if f == 'coverage.cobertura.xml'
        ]
        if not xml_files:
            print("No coverage.cobertura.xml found, skipping PR comment.")
            sys.exit(0)

        # Merge coverage by source line/branch across all reports so shared source files
        # from multiple test projects are not double-counted.
        merged_lines = {}
        merged_branches = {}

        for xml_file in xml_files:
            root = ET.parse(xml_file).getroot()
            for cls in root.findall('.//class'):
                filename = cls.get('filename')
                if not filename or '/obj/' in filename.replace('\\', '/'):
                    continue

                for line in cls.findall('./lines/line'):
                    line_number = int(line.get('number', 0) or 0)
                    hits = int(line.get('hits', 0) or 0)
                    line_key = (filename, line_number)
                    merged_lines[line_key] = max(merged_lines.get(line_key, 0), hits)

                    if line.get('branch') == 'True':
                        coverage = line.get('condition-coverage', '')
                        if '(' in coverage and '/' in coverage:
                            fraction = coverage.split('(', 1)[1].split(')', 1)[0]
                            covered, valid = (int(part) for part in fraction.split('/', 1))
                        else:
                            covered = 1 if hits > 0 else 0
                            valid = 1

                        branch_key = (filename, line_number)
                        prev_covered, prev_valid = merged_branches.get(branch_key, (0, 0))
                        merged_branches[branch_key] = (
                            max(prev_covered, covered),
                            max(prev_valid, valid),
                        )

        total_valid = len(merged_lines)
        total_covered = sum(1 for hits in merged_lines.values() if hits > 0)
        total_branches_valid = sum(valid for _, valid in merged_branches.values())
        total_branches_covered = sum(covered for covered, _ in merged_branches.values())

        line_rate   = (total_covered / total_valid   * 100) if total_valid   > 0 else 0.0
        branch_rate = (total_branches_covered / total_branches_valid * 100) if total_branches_valid > 0 else 0.0

        emoji = '✅' if line_rate >= 80 else '⚠️' if line_rate >= 60 else '❌'
        sha   = os.environ['COMMIT_SHA'][:7]

        comment = (
            f"{MARKER}\n\n"
            f"## {emoji} Code Coverage Report — `{sha}`\n\n"
            f"| Metric | Coverage |\n"
            f"|--------|----------|\n"
            f"| **Lines** | {line_rate:.1f}% ({total_covered}/{total_valid} lines) |\n"
            f"| **Branches** | {branch_rate:.1f}% |\n\n"
            f"<sub>Generated by CI from `dotnet test --collect:\"XPlat Code Coverage\"`</sub>"
        )

        pr   = os.environ['PR_NUMBER']
        repo = os.environ['REPO']

        # Find an existing coverage comment by the bot with our marker and update it;
        # fall back to creating a new comment if none exists.
        list_result = subprocess.run(
            ['gh', 'api', f'repos/{repo}/issues/{pr}/comments',
             '--jq', f'[.[] | select(.body | startswith("{MARKER}")) | .id][0]'],
            capture_output=True, text=True
        )
        comment_id = list_result.stdout.strip()

        if comment_id and comment_id != 'null' and comment_id != '':
            subprocess.run(
                ['gh', 'api', f'repos/{repo}/issues/comments/{comment_id}',
                 '-X', 'PATCH', '-f', f'body={comment}'],
                check=True
            )
            print(f"Updated existing coverage comment {comment_id}.")
        else:
            subprocess.run(
                ['gh', 'pr', 'comment', pr, '--repo', repo, '--body', comment],
                check=True
            )
            print("Created new coverage comment.")
        PYEOF

  package:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [version-calculation, build-and-test]
    if: >-
      ((github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version-calculation.outputs.version }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0
        
    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'
        
    - name: Update props
      run: |
        sed -i "s|<PackageReference Include=\"NetMediate\" Version=\"[^\"]*\" />|<PackageReference Include=\"NetMediate\" Version=\"${VERSION}\" />|g" src/NetMediate.SourceGeneration/buildTransitive/NetMediate.SourceGeneration.props

    - name: Restore dependencies
      run: dotnet restore net-mediate.slnx
      
    - name: Build Release (all projects/targets)
      run: dotnet build net-mediate.slnx --configuration Release /p:Version=${VERSION}

    - name: Pack NetMediate package
      run: dotnet pack src/NetMediate/NetMediate.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Core package
      run: dotnet pack src/NetMediate.Core/NetMediate.Core.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.Moq package
      run: dotnet pack src/NetMediate.Moq/NetMediate.Moq.csproj --configuration Release --output ./packages /p:Version=${VERSION}

    - name: Pack NetMediate.SourceGeneration package
      run: dotnet pack src/NetMediate.SourceGeneration/NetMediate.SourceGeneration.csproj --configuration Release --output ./packages /p:Version=${VERSION}
      
    - name: Upload package artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 90

  publish:
    name: Publish to NuGet
    runs-on: ubuntu-latest
    needs: [package]
    # Publish to NuGet only on main; tag pushes attach packages to the GitHub
    # Release (created by the release job) but do not push to NuGet.
    if: github.ref == 'refs/heads/main'
    # Declaring a GitHub Environment makes this job appear in the Deployments section
    # and allows protection rules (required reviewers, wait timers, etc.) to be
    # configured on the "nuget" environment in repository Settings → Environments.
    environment: nuget
    permissions:
      contents: read
      packages: write

    steps:
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: ./packages

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.x'

    - name: Publish to NuGet
      run: dotnet nuget push ./packages/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    - name: Publish to GitHub Packages
      continue-on-error: true
      run: dotnet nuget push ./packages/*.nupkg --api-key $GITHUB_TOKEN --source https://nuget.pkg.github.com/schivei/index.json --skip-duplicate
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-calculation, package, publish]
    # Run when the package job succeeded AND either:
    #   • publish succeeded (main branch — both NuGet push and GitHub Release)
    #   • publish was skipped (tag push — create GitHub Release without a NuGet push)
    if: >-
      needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      
    - name: Download package artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: nuget-packages
        path: ./packages

    - name: Determine tag name
      id: tag
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          echo "tag_name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        else
          echo "tag_name=v${{ needs.version-calculation.outputs.version }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Create Release
      uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        target_commitish: ${{ github.sha }}
        files: ./packages/*.nupkg
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(steps.tag.outputs.tag_name, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
